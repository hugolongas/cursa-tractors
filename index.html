<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualització - Gran Premi de Tractors</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }

        #media-container video,
        #media-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* Evita qualsevol recollida o tall de la imatge/vídeo sencer */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body class="bg-black text-white h-screen overflow-hidden relative flex flex-col justify-end select-none">

    <!-- FONDO MULTIMÈDIA A PANTALLA COMPLETA (COVER CORREGIT) -->
    <div id="media-container" class="absolute inset-0 w-full h-full z-0 overflow-hidden"></div>
    <div
        class="absolute inset-0 w-full h-full bg-gradient-to-t from-black via-black/40 to-transparent z-1 pointer-events-none">
    </div>

    <!-- PISTA INVISIBLE AMB LÍNIA DE SORTIDA I ARRIBADA (85% D'AMPLE) -->
    <main class="relative z-10 w-[85vw] mx-auto pb-10 flex flex-col justify-end gap-3">
        <div class="flex items-center gap-6 w-full">

            <!-- Zona de cursa ampla per als tractors -->
            <div id="common-track" class="relative flex-1 h-48 md:h-60 flex items-center">

                <!-- Línia de sortida (a l'esquerra) -->
                <div class="absolute left-2 inset-y-0 w-1 border-l-2 border-dashed border-white/40 z-0"></div>

                <!-- Línia de meta (a la dreta) -->
                <div class="absolute right-4 inset-y-0 w-1 border-r-4 border-dashed border-yellow-400 z-0"></div>

                <!-- Tractors grans i separats verticalment -->
                <div id="tractor-bisky" class="absolute left-2 top-0 transition-all duration-500 z-10"
                    style="transform: translateX(0px);">
                    <img src="tractors/bisky.png" alt="Bisky"
                        class="h-10 md:h-14 w-auto drop-shadow-[0_4px_6px_rgba(0,0,0,0.9)] object-contain">
                </div>
                <div id="tractor-cantiimplora" class="absolute left-2 top-10 transition-all duration-500 z-20"
                    style="transform: translateX(0px);">
                    <img src="tractors/can_timplora.png" alt="Can T'Implora"
                        class="h-10 md:h-14 w-auto drop-shadow-[0_4px_6px_rgba(0,0,0,0.9)] object-contain">
                </div>
                <div id="tractor-concos" class="absolute left-2 top-20 transition-all duration-500 z-30"
                    style="transform: translateX(0px);">
                    <img src="tractors/concos.png" alt="Concos"
                        class="h-10 md:h-14 w-auto drop-shadow-[0_4px_6px_rgba(0,0,0,0.9)] object-contain">
                </div>
                <div id="tractor-skando" class="absolute left-2 top-32 transition-all duration-500 z-40"
                    style="transform: translateX(0px);">
                    <img src="tractors/skando.png" alt="Skando"
                        class="h-10 md:h-14 w-auto drop-shadow-[0_4px_6px_rgba(0,0,0,0.9)] object-contain">
                </div>
                <div id="tractor-sporting" class="absolute left-2 top-44 transition-all duration-500 z-50"
                    style="transform: translateX(0px);">
                    <img src="tractors/sporting.png" alt="Sporting l'Olla"
                        class="h-10 md:h-14 w-auto drop-shadow-[0_4px_6px_rgba(0,0,0,0.9)] object-contain">
                </div>

            </div>

            <!-- COMPTADORS DE VOLTES DE LES COLLES AL COSTAT -->
            <div
                class="flex flex-col justify-center gap-1.5 text-right font-black text-xs md:text-sm drop-shadow-md min-w-[80px] bg-black/50 p-3 rounded-xl backdrop-blur-md border border-white/10">
                <div class="text-orange-400">Bisky: <span id="laps-bisky">0</span>v</div>
                <div class="text-red-500">Can T: <span id="laps-cantiimplora">0</span>v</div>
                <div class="text-blue-500">Concos: <span id="laps-concos">0</span>v</div>
                <div class="text-yellow-300">Skando: <span id="laps-skando">0</span>v</div>
                <div class="text-pink-400">Sport: <span id="laps-sporting">0</span>v</div>
            </div>
        </div>
    </main>

    <!-- FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBTNOyQZBGPXCITEG-Z76Cmij0ubiwARxg",
            authDomain: "cursa-tractors.firebaseapp.com",
            projectId: "cursa-tractors",
            storageBucket: "cursa-tractors.firebasestorage.app",
            messagingSenderId: "591708316625",
            appId: "1:591708316625:web:00208cfef3608d8c9736f0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const colles = ['bisky', 'cantiimplora', 'concos', 'skando', 'sporting'];

        onSnapshot(doc(db, "cursa", "marcador"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                const track = document.getElementById('common-track');
                const trackWidth = track.clientWidth - 80;

                colles.forEach((id) => {
                    const totalScore = data[id] || 0;
                    const progress = totalScore % 100;
                    const laps = Math.floor(totalScore / 100);

                    const lapsEl = document.getElementById(`laps-${id}`);
                    if (lapsEl) lapsEl.innerText = laps;

                    const iconContainer = document.getElementById(`tractor-${id}`);
                    if (iconContainer) {
                        const pixelPos = (progress / 100) * trackWidth;
                        iconContainer.style.transform = `translateX(${Math.max(0, pixelPos)}px)`;
                    }
                });
            }
        });

        const mediaFiles = [
            'media/1.mp4', 'media/2.jpg', 'media/3.jpg', 'media/4.jpg', 'media/5.jpg',
            'media/6.jpg', 'media/7.jpg', 'media/8.jpg', 'media/9.jpg', 'media/10.jpg',
            'media/11.jpg', 'media/12.jpg', 'media/13.jpg', 'media/skando.mp4', 'media/14.jpg',
            'media/15.jpg', 'media/16.jpg', 'media/17.jpg', 'media/18.jpg', 'media/19.jpg',
            'media/20.jpg', 'media/21.jpg', 'media/sporting.mp4', 'media/22.jpg', 'media/23.jpg',
            'media/24.jpg', 'media/25.jpg', 'media/26.jpg', 'media/27.jpg', 'media/28.jpg',
            'media/29.jpg', 'media/30.jpg', 'media/bisky.mp4', 'media/31.jpg', 'media/32.jpg',
            'media/33.jpg', 'media/34.jpg', 'media/35.jpg', 'media/36.jpg', 'media/37.jpg',
            'media/38.jpg', 'media/39.jpg', 'media/40.jpg', 'media/41.jpg', 'media/42.jpg',
            'media/43.jpg', 'media/44.jpg', 'media/45.jpg', 'media/can_timplora.mp4', 'media/46.jpg',
            'media/47.jpg', 'media/48.jpg', 'media/49.jpg', 'media/50.jpg', 'media/51.jpg',
            'media/52.jpg', 'media/53.jpg', 'media/54.jpg', 'media/55.jpg', 'media/56.jpg',
            'media/57.jpg', 'media/58.jpg', 'media/59.jpg', 'media/60.jpg', 'media/61.jpg',
            'media/62.jpg', 'media/63.jpg', 'media/64.jpg', 'media/concos.mp4', 'media/65.jpg'
        ];
        let currentMediaIndex = 0;
        let shuffledIndices = [];
        const mediaContainer = document.getElementById('media-container');

        // Función para generar un array de índices mezclados aleatoriamente (Algoritmo de Fisher-Yates)
        function generateShuffledIndices(length) {
            let indices = Array.from({ length }, (_, i) => i);
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            return indices;
        }

        function playNextMedia() {
            if (mediaFiles.length === 0) return;

            // Si ya hemos recorrido todos los elementos, volvemos a barajar para el siguiente ciclo
            if (currentMediaIndex >= shuffledIndices.length) {
                shuffledIndices = generateShuffledIndices(mediaFiles.length);
                currentMediaIndex = 0;
            }

            // Obtenemos el índice aleatorio correspondiente en este ciclo
            const fileIndex = shuffledIndices[currentMediaIndex];
            currentMediaIndex++;

            const file = mediaFiles[fileIndex];

            mediaContainer.innerHTML = '';
            const ext = file.split('.').pop().toLowerCase();

            if (['mp4', 'webm', 'ogg'].includes(ext)) {
                const video = document.createElement('video');
                video.src = file;
                video.autoplay = true;
                video.muted = true;
                video.playsInline = true;
                video.onended = playNextMedia;
                mediaContainer.appendChild(video);
            } else {
                const img = document.createElement('img');
                img.src = file;
                mediaContainer.appendChild(img);
                setTimeout(playNextMedia, 10000);
            }
        }

        // Inicializamos la primera baraja y arrancamos la reproducción
        if (mediaFiles.length > 0) {
            shuffledIndices = generateShuffledIndices(mediaFiles.length);
            playNextMedia();
        }
    </script>
</body>

</html>
