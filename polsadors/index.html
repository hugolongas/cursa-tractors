<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polsadors - Cursa de Tractors</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col justify-between p-4 md:p-8 select-none">

    <header class="text-center mb-6 flex flex-col items-center gap-3">
        <h1 class="text-2xl md:text-4xl font-black uppercase text-yellow-400">🎛️ Panell de Polsadors</h1>
        <p class="text-gray-400 text-sm">Prem per sumar punts a cada colla</p>
        
        <!-- BOTÓ PER REINICIAR TOT A ZERO -->
        <button onclick="reiniciarPunts()" class="mt-2 bg-red-900/60 hover:bg-red-800 text-red-200 border border-red-500/40 px-5 py-2.5 rounded-xl font-bold text-sm shadow-md transition active:scale-95 flex items-center gap-2">
            🔄 Reiniciar Cursa (Posar a 0)
        </button>
    </header>

    <main class="max-w-4xl mx-auto w-full grid grid-cols-1 gap-4" id="controls-grid"></main>

    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBTNOyQZBGPXCITEG-Z76Cmij0ubiwARxg",
            authDomain: "cursa-tractors.firebaseapp.com",
            projectId: "cursa-tractors",
            storageBucket: "cursa-tractors.firebasestorage.app",
            messagingSenderId: "591708316625",
            appId: "1:591708316625:web:00208cfef3608d8c9736f0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const colles = [
            { id: 'bisky', name: 'Bisky (Naranja)', bgBtn: 'bg-orange-500 hover:bg-orange-600 active:bg-orange-700', textCol: 'text-orange-400' },
            { id: 'cantiimplora', name: "Can T'Implora (Vermell)", bgBtn: 'bg-red-600 hover:bg-red-700 active:bg-red-800', textCol: 'text-red-500' },
            { id: 'concos', name: 'Concos (Blau Royale)', bgBtn: 'bg-blue-600 hover:bg-blue-700 active:bg-blue-800', textCol: 'text-blue-500' },
            { id: 'skando', name: 'Skando (Groc)', bgBtn: 'bg-yellow-400 hover:bg-yellow-500 active:bg-yellow-600 text-black font-black', textCol: 'text-yellow-300' },
            { id: 'sporting', name: "Sporting l'Olla (Rosa)", bgBtn: 'bg-pink-500 hover:bg-pink-600 active:bg-pink-700', textCol: 'text-pink-400' }
        ];

        const grid = document.getElementById('controls-grid');
        grid.innerHTML = colles.map(c => `
            <div class="bg-gray-900 border border-white/10 p-5 rounded-2xl flex items-center justify-between shadow-xl">
                <div>
                    <h2 class="text-lg md:text-xl font-bold ${c.textCol}">${c.name}</h2>
                    <p class="text-xs text-gray-400">Total acumulat: <span id="val-${c.id}" class="text-white font-black text-xl">0</span></p>
                </div>
                <div class="flex items-center gap-3">                    
                    <button onclick="modificarPunts('${c.id}', 1)" class="${c.bgBtn} px-6 py-4 rounded-2xl font-black text-2xl shadow-lg transition active:scale-95 flex items-center gap-2">+1 🚜</button>
                </div>
            </div>
        `).join('');

        window.modificarPunts = async (collaId, quantitat) => {
            const docRef = doc(db, "cursa", "marcador");
            try {
                const docSnap = await getDoc(docRef);
                if (!docSnap.exists()) {
                    await setDoc(docRef, { bisky: 0, cantiimplora: 0, concos: 0, skando: 0, sporting: 0 });
                }
                await updateDoc(docRef, { [collaId]: increment(quantitat) });
            } catch (error) {
                console.error("Error en actualitzar punts:", error);
            }
        };

        // FUNCIÓ PER REINICIAR TOTES LES COLLES A ZERO
        window.reiniciarPunts = async () => {
            if (confirm("Estàs segur que vols posar el marcador de TOTES les colles a 0?")) {
                const docRef = doc(db, "cursa", "marcador");
                try {
                    await setDoc(docRef, {
                        bisky: 0,
                        cantiimplora: 0,
                        concos: 0,
                        skando: 0,
                        sporting: 0
                    });
                } catch (error) {
                    console.error("Error en reiniciar els punts:", error);
                }
            }
        };

        onSnapshot(doc(db, "cursa", "marcador"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                colles.forEach(c => {
                    const el = document.getElementById(`val-${c.id}`);
                    if (el) el.innerText = data[c.id] || 0;
                });
            }
        });
    </script>
</body>
</html>
